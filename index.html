const MEMO_DAYS=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
function memoEnsure(){
  if(!S.memo || typeof S.memo!=='object') S.memo={};
  if(!Array.isArray(S.memo.notes)) S.memo.notes=[];
  if(!Array.isArray(S.memo.plans)) S.memo.plans=[];
  if(!Array.isArray(S.memo.routine)) S.memo.routine=[];
  if(!Array.isArray(S.memo.events)) S.memo.events=[];
  if(!S.memo.done || typeof S.memo.done!=='object') S.memo.done={};
  if(!S.memo.tab) S.memo.tab='plans';
  if(!('editor' in S.memo)) S.memo.editor=null;
  if(!S.theme) S.theme='dark';
}
const THEME_KEY='mpf_theme';
function readGlobalTheme(){
  try{
    const saved=localStorage.getItem(THEME_KEY);
    if(saved==='light'||saved==='dark')return saved;
    const legacy=S&&S.theme==='light'?'light':'dark';
    localStorage.setItem(THEME_KEY,legacy);
    return legacy;
  }catch(e){return S&&S.theme==='light'?'light':'dark'}
}
function applyTheme(){
  S.theme='dark';
  document.documentElement.removeAttribute('data-theme');
  try{localStorage.removeItem('mpf_theme')}catch(e){}
  const meta=document.querySelector('meta[name="theme-color"]');
  if(meta) meta.content='#1E1F23';
}
function themeSet(t){
  const next=t==='light'?'light':'dark';
  S.theme=next;
  try{localStorage.setItem(THEME_KEY,next)}catch(e){}
  applyTheme();
  save();
}
window.addEventListener('storage',e=>{
  if(e.key===THEME_KEY&&(e.newValue==='light'||e.newValue==='dark')){
    applyTheme();
    if(typeof drwSync==='function')try{drwSync()}catch(x){}
  }
});

function memoNew(type,date){
  memoEnsure();memoOpenPage();
  const id=uid(),now=new Date().toISOString();
  if(type==='plan') S.memo.plans.unshift({id,title:'Novo plano',summary:'',start:today,weeks:12,body:'',created:now,updated:now});
  else if(type==='note') S.memo.notes.unshift({id,title:'Nova anotação',body:'',created:now,updated:now});
  else if(type==='event') S.memo.events.unshift({id,date:date||today,time:'18:00',title:'Novo compromisso',color:'#A9D4F5',note:'',created:now,updated:now});
  else S.memo.routine.push({id,time:'18:00',title:'Novo horário recorrente',days:[1,2,3,4,5],color:'#8BC5FF',active:true});
  S.memo.editor={type,id};S.memo.tab=type==='plan'?'plans':type==='note'?'notes':'routine';save()
}

function memoSaveEditor(){
  memoEnsure();const e=S.memo.editor;if(!e)return;
  const title=(document.getElementById('memo-title')?.value||'').trim();
  if(!title)return toast('Escreva um título.');
  if(e.type==='routine'){
    const item=S.memo.routine.find(x=>x.id===e.id);if(!item)return;
    const time=document.getElementById('memo-time')?.value||'18:00';
    const days=[...document.querySelectorAll('[name="memo-days"]:checked')].map(x=>+x.value);
    if(!days.length)return toast('Selecione pelo menos um dia.');
    item.time=time;item.title=title;item.days=days;item.color=document.getElementById('memo-color')?.value||'#8BC5FF';item.active=true;
  }else if(e.type==='event'){
    const item=S.memo.events.find(x=>x.id===e.id);if(!item)return;
    const date=document.getElementById('memo-event-date')?.value||today;
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date))return toast('Escolha uma data válida.');
    item.date=date;item.time=document.getElementById('memo-event-time')?.value||'18:00';item.title=title;item.color=document.getElementById('memo-event-color')?.value||'#A9D4F5';item.note=document.getElementById('memo-body')?.value||'';item.updated=new Date().toISOString();
  }else{
    const item=e.type==='plan'?S.memo.plans.find(x=>x.id===e.id):S.memo.notes.find(x=>x.id===e.id);if(!item)return;
    item.title=title;item.body=document.getElementById('memo-body')?.value||'';
    if(e.type==='plan'){item.summary=document.getElementById('memo-summary')?.value||'';item.start=document.getElementById('memo-start')?.value||today;item.weeks=Math.max(1,Math.min(104,+document.getElementById('memo-weeks')?.value||12));}
    item.updated=new Date().toISOString();
  }

}
